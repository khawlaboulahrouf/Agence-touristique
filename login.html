<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">

</head>
<body>
    <header class="header">
        <div class="logo">
            <div>
                <img src="images/Viator_logo.png" alt=" Viator_logo">
            </div>
            <div >
            <img src="images/powered_by_logo.svg" alt="powered_by_logo" id="powered" style="margin-left: 12vh;">
            </div>
        </div>
        <hr>
    </header>
    <main class="main">
        <article>
            <img src="images/touch-icon.webp" alt="touch" id="touch-icon">
            <h3>Log in and get exploring</h3>
        </article>
        <figure class="descript">
            <p>Log into your account with your email, or create one below. Quick and easy - promise!</p>
        </figure>
        <p class="email">
            <div>email</div>
            <div>Continue</div>
        </p>
        <section class="social">
            <div>
                <div class="icons">
                    <img src="images/google.webp" alt="google">
                </div>
                <div class="icons">
                    <img src="images/facebook.webp" alt="facebook">
                </div>
                <div class="icons">
                    <img src="images/IPhone.webp" alt="IPhone">
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
